name: publish
run-name: publish

permissions:
  contents: read
  packages: read

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: collect
        run: |
          mkdir -p input
          cp \
            ./bylaw-account/bylaw-account.md \
            ./agreement/welcoming/README.md \
            ./bylaw-master/bylaw-master.md \
            ./bylaw-welcoming/bylaw-welcoming.md \
            ./input/

      - name: build
        uses: docker://ghcr.io/8128-33550336/regulations-generator:3592f417c647893330517a0b626f5fae33c9596c
        with:
          args: gen -a ./input ./output

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './output'

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
